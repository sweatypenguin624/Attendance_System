<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Recognition System</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          #000000 60%,
          #1e3a8a 100%
        ); /* Increased blue */
        font-family: "Jost", sans-serif, Arial, Helvetica;
        color: #ffffff;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      h1.title {
        font-size: 3.5rem;
        font-weight: 600;
        margin-bottom: 20px;
        letter-spacing: 1px;
        background: linear-gradient(to right, #6b7280, #d1d5db);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 500px;
        width: 90%;
      }

      video#video {
        width: 100%;
        max-width: 400px;
        height: auto;
        border-radius: 10px;
        margin-bottom: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }

      .btn.primary,
      .btn.secondary {
        padding: 0.9rem 2.2rem;
        font-size: 1.1rem;
        background-color: #ffffff;
        color: #000000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        font-family: "Jost", sans-serif;
      }

      .btn.primary:hover,
      .btn.secondary:hover {
        background-color: #e5e5e5;
        transform: translateY(-2px);
      }

      .btn.secondary {
        background-color: #d1d5db;
        color: #000000;
      }

      .btn.secondary:hover {
        background-color: #b3b3b3;
      }

      #result {
        margin-top: 20px;
        font-size: 1rem;
        color: #22c55e;
        min-height: 24px;
      }

      #result.error {
        color: #ef4444;
      }

      @media (max-width: 600px) {
        h1.title {
          font-size: clamp(2rem, 6vw, 2.5rem);
        }

        .card {
          padding: 15px;
        }

        video#video {
          max-width: 100%;
        }

        .btn.primary,
        .btn.secondary {
          padding: 0.7rem 1.8rem;
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Face Recognition System</h1>
      <div class="card">
        <video id="video" autoplay></video>
        <div class="buttons">
          <button id="capture-btn" class="btn primary">Scan Face</button>
          <!-- Uncomment if Send Attendance button is needed -->
          <!-- <button onclick="sendEmail()" class="btn secondary">Send Attendance</button> -->
        </div>
        <div id="result" class="result"></div>
      </div>
    </div>

    <script src="/static/js/main.js"></script>
  </body>
</html>
